{% extends 'base.html' %}

{% block title %}{% if product %}Editar producto{% else %}Crear producto{% endif %} | Blush & Glow{% endblock %}

{% block content %}
  <section class="inventory-panel" style="padding: 3rem 4%;">
    <h2>{% if product %}Editar Producto{% else %}Crear Nuevo Producto{% endif %}</h2>

    <form method="post" action="{% if product %}{% url 'product_edit' product.id %}{% else %}{% url 'product_create' %}{% endif %}" class="contact-form" style="max-width: 700px; margin: 2rem auto;">
      {% csrf_token %}

      <div class="form-field">
        <label for="name">Nombre del producto</label>
        <input id="name" type="text" name="name" value="{{ product.name|default_if_none:'' }}" required />
      </div>

      <div class="form-field">
        <label for="brand">Marca</label>
        <input id="brand" type="text" name="brand" value="{{ product.brand|default_if_none:'' }}" required />
      </div>

      <div class="form-field">
        <label for="category">Categoría</label>
        <select id="category" name="category">
          {% for value, label in categories %}
            <option value="{{ value }}" {% if product and product.category == value %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-field">
        <label for="price">Precio (USD)</label>
        <input id="price" type="number" step="0.01" min="0.01" name="price" value="{{ product.price|default_if_none:'' }}" required />
      </div>

      <div class="form-field">
        <label for="image_url">URL de imagen</label>
        <input id="image_url" type="url" name="image_url" value="{{ product.image_url|default_if_none:'' }}" />
      </div>

      <div class="form-field">
        <label for="description">Descripción</label>
        <textarea id="description" name="description" rows="5" required>{{ product.description|default_if_none:'' }}</textarea>
      </div>

      <div style="display:flex; gap:1rem; justify-content:flex-end; align-items:center; margin-top:1rem;">
        <a class="btn btn-secondary" href="{% url 'inventory' %}" style="text-decoration:none;">Cancelar</a>
        <button type="submit" class="btn">Guardar</button>
      </div>
    </form>
  </section>
{% endblock %}
